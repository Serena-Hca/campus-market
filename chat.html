<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私聊 - 校园二手集市</title>
  <link rel="stylesheet" href="common.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #333;
    }
    header {
      background: #fff;
      padding: 14px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
    }
    header h1 { font-size: 17px; flex: 1; }
    header a { color: #07c160; text-decoration: none; font-size: 14px; }
    main { max-width: 720px; margin: 16px auto; padding: 0 16px; }

    /* 顶部：聊的是哪件物品 */
    .item-bar {
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      margin-bottom: 12px;
    }
    .item-bar img {
      width: 48px; height: 48px;
      object-fit: cover;
      border-radius: 6px;
      background: #f5f6f8;
      flex-shrink: 0;
    }
    .item-bar .t { font-size: 15px; font-weight: bold; }
    .item-bar .p { color: #e6432d; font-weight: bold; font-size: 14px; margin-top: 2px; }
    .sold-tag {
      display: inline-block;
      background: #eee; color: #999;
      font-size: 11px; padding: 1px 6px;
      border-radius: 4px; margin-left: 6px;
      font-weight: normal;
    }

    /* 消息区 */
    .chat-box {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 220px);
      min-height: 320px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
    }
    .msg-row { display: flex; margin-bottom: 12px; }
    .msg-row.me { justify-content: flex-end; }
    /* 宽度上限要套在"包裹层"上（它的父元素是整行，宽度确定）；
       之前写在气泡上时父层宽度由内容撑出，百分比陷入循环依赖，气泡被压成一个字宽 */
    .msg-row > div { max-width: 72%; }
    .bubble {
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
      background: #f0f0f0;
    }
    .msg-row.me .bubble { background: #07c160; color: #fff; }
    .msg-time { font-size: 11px; color: #bbb; margin-top: 3px; }
    .msg-row.me .msg-time { text-align: right; }
    .empty-tip { text-align: center; color: #999; font-size: 13px; padding: 40px 0; }

    /* 底部输入区 */
    .input-row {
      display: flex;
      gap: 10px;
      padding: 12px 14px;
      border-top: 1px solid #f0f0f0;
    }
    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 15px;
    }
    .input-row input:focus { outline: none; border-color: #07c160; }
    .input-row button {
      background: #07c160;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 0 20px;
      font-size: 15px;
      cursor: pointer;
    }
    .input-row button:disabled { background: #9adcb7; }
    .error { text-align: center; color: #e6432d; padding: 40px 0; }
    /* ———— 浅绿主题升级 ———— */
    body { background: var(--green-bg); }
    header h1 { color: var(--green-dark); }
    header a { color: var(--green-deep) !important; }
    .item-bar { border-radius: 14px; box-shadow: var(--shadow); }
    .item-bar img { border-radius: 10px; }
    .chat-box { border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
    .bubble { background: #fff; color: var(--ink); border-radius: 16px; box-shadow: 0 1px 4px rgba(76,175,109,.12); }
    .msg-row.me .bubble { background: var(--green-grad); color: #fff; box-shadow: 0 2px 8px rgba(76,175,109,.3); }
    .msg-time { color: #b3beb5; }
    .input-row input { border-radius: 999px; }
    .input-row button { border: none; background: var(--green-grad); color: #fff; border-radius: 999px; box-shadow: 0 2px 8px rgba(76,175,109,.25); }
  </style>
</head>
<body>
  <header>
    <a href="inbox.html">← 消息列表</a>
    <h1 id="chat-title">私聊</h1>
    <a href="index.html">首页</a>
  </header>
  <main>
    <div class="item-bar" id="item-bar"></div>
    <div class="chat-box">
      <div id="messages"><p class="empty-tip">加载中…</p></div>
      <div class="input-row">
        <input type="text" id="msg-input" placeholder="说点什么…（500 字以内，回车发送）" maxlength="500">
        <button id="btn-send" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </main>

  <script src="lib/supabase.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="chat.js"></script>
</body>
</html>
