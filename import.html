<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 回填 - 校园二手集市</title>
  <link rel="stylesheet" href="common.css">
  <style>
    main { max-width: 560px; margin: 24px auto; padding: 0 16px 40px; }
    .card { background: #fff; border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
    .page-title { font-size: 20px; color: var(--green-dark); margin-bottom: 4px; }
    .page-desc { font-size: 13px; color: var(--gray); margin-bottom: 16px; }
    textarea { resize: vertical; min-height: 140px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
    button {
      width: 100%; padding: 12px; margin-top: 16px; border: none;
      background: var(--green-grad); color: #fff; border-radius: 999px;
      font-size: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(76,175,109,.3);
    }
    button:hover { filter: brightness(1.06); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #preview { margin-top: 20px; border-top: 1px dashed var(--line); padding-top: 16px; }
    #preview.hidden { display: none; }
    .pv-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 14px; }
    .pv-label { flex: none; width: 60px; color: var(--gray); }
    .pv-value { word-break: break-all; }
    .pv-reasons { margin: 4px 0 8px; padding-left: 18px; font-size: 13px; color: var(--red); }
    .pv-reasons:empty { display: none; }
    .msg { color: var(--red); }
  </style>
</head>
<body>
  <header>
    <h1>🛒 校园二手集市</h1>
    <a href="index.html">← 返回首页</a>
  </header>
  <main>
    <div class="card">
      <h2 class="page-title">AI 回填</h2>
      <p class="page-desc">把发布助手整理好的商品条目一键上架，省去手动填表</p>

      <textarea id="json-input" placeholder="把发布助手输出的 JSON 粘到这里"></textarea>
      <button id="btn-parse" onclick="parsePreview()">解析预览</button>

      <div id="preview" class="hidden">
        <div class="pv-row"><span class="pv-label">标题</span><span class="pv-value" id="pv-title"></span></div>
        <div class="pv-row"><span class="pv-label">分类</span><span class="pv-value" id="pv-category"></span></div>
        <div class="pv-row"><span class="pv-label">价格</span><span class="pv-value" id="pv-price"></span></div>
        <div class="pv-row"><span class="pv-label">描述</span><span class="pv-value" id="pv-description"></span></div>
        <div class="pv-row"><span class="pv-label">联系方式</span><span class="pv-value" id="pv-contact"></span></div>
        <ul class="pv-reasons" id="pv-reasons"></ul>
        <button id="btn-confirm" onclick="confirmImport()" disabled>确认上架</button>
      </div>

      <p class="msg" id="msg"></p>
    </div>
  </main>

  <script src="lib/supabase.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="import.js"></script>
</body>
</html>
